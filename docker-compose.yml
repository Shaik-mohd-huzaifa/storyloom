services:
  backend:
    image: sl-be
    container_name: sl-be
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - MONGO_URI=mongodb://mongodb:27017
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_EXTRACTION_MODEL=${OPENAI_EXTRACTION_MODEL:-gpt-4o-mini}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - CHAT_AGENT_MAX_ITERATIONS=${CHAT_AGENT_MAX_ITERATIONS:-6}
    ports:
      - "8000:8000"
    depends_on:
      - neo4j
      - chromadb
      - mongodb

  frontend:
    image: sl-fe
    container_name: sl-fe
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development

  neo4j:
    image: neo4j:5.15-community
    container_name: sl-neo4j
    ports:
      - "7687:7687"
      - "7474:7474"
      - "7473:7473"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/var/lib/neo4j/data
      - neo4j_logs:/var/lib/neo4j/logs

  chromadb:
    image: chromadb/chroma:latest
    container_name: sl-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma

  mongodb:
    image: mongo:7
    container_name: sl-mongodb
    ports:
      - "27020:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongodb_data:/data/db

volumes:
  neo4j_data:
  neo4j_logs:
  chromadb_data:
  mongodb_data:
