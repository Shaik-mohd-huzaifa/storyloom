services:
  # FastAPI Backend Service
  backend:
    image: python:3.11-slim
    container_name: storyloom-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install fastapi uvicorn pymongo neo4j &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - PYTHONUNBUFFERED=1
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/storyloom?authSource=admin
    depends_on:
      - neo4j
      - mongodb

  # Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: storyloom-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development

  # Neo4j Graph Database Service
  neo4j:
    image: neo4j:5.15-community
    container_name: storyloom-neo4j
    ports:
      - "7687:7687"
      - "7474:7474"
      - "7473:7473"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/var/lib/neo4j/data
      - neo4j_logs:/var/lib/neo4j/logs

  # MongoDB Document Database
  mongodb:
    image: mongo:7.0
    container_name: storyloom-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongodb_data:/data/db

volumes:
  neo4j_data:
  neo4j_logs:
  mongodb_data:
